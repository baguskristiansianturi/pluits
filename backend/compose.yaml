services:
  database:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in backend/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_INITDB_ARGS: --data-checksums
    shm_size: 256mb
    volumes:
      - pluits-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [data]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    restart: "no"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?sslmode=disable
    command: ["-command=up"]
    depends_on:
      database:
        condition: service_healthy
    networks: [data]

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?sslmode=disable
      PLUITS_OUTBOX_ENCRYPTION_KEY: ${PLUITS_OUTBOX_ENCRYPTION_KEY:?Set PLUITS_OUTBOX_ENCRYPTION_KEY in backend/.env}
      PLUITS_OUTBOX_KEY_VERSION: ${PLUITS_OUTBOX_KEY_VERSION:-1}
      PLUITS_RATE_LIMIT_KEY: ${PLUITS_RATE_LIMIT_KEY:?Set PLUITS_RATE_LIMIT_KEY in backend/.env}
      PLUITS_ALLOWED_ORIGINS: ${PLUITS_ALLOWED_ORIGINS:?Set exact HTTPS origins in backend/.env}
    expose: ["8080"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [data, outbound]

  email-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: email-worker
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?sslmode=disable
      PLUITS_OUTBOX_ENCRYPTION_KEY: ${PLUITS_OUTBOX_ENCRYPTION_KEY:?Set PLUITS_OUTBOX_ENCRYPTION_KEY in backend/.env}
      PLUITS_OUTBOX_KEY_VERSION: ${PLUITS_OUTBOX_KEY_VERSION:-1}
      PLUITS_PUBLIC_BASE_URL: ${PLUITS_PUBLIC_BASE_URL:?Set PLUITS_PUBLIC_BASE_URL in backend/.env}
      PLUITS_SMTP_HOST: ${PLUITS_SMTP_HOST:?Set PLUITS_SMTP_HOST in backend/.env}
      PLUITS_SMTP_PORT: ${PLUITS_SMTP_PORT:-587}
      PLUITS_SMTP_FROM: ${PLUITS_SMTP_FROM:?Set PLUITS_SMTP_FROM in backend/.env}
      PLUITS_SMTP_USERNAME: ${PLUITS_SMTP_USERNAME:-}
      PLUITS_SMTP_PASSWORD: ${PLUITS_SMTP_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [data, outbound]

  backup:
    build:
      context: ./infra/backup
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?sslmode=disable
      PLUITS_BACKUP_AGE_RECIPIENT: ${PLUITS_BACKUP_AGE_RECIPIENT:?Set an age public recipient in backend/.env}
      PLUITS_BACKUP_INTERVAL_SECONDS: ${PLUITS_BACKUP_INTERVAL_SECONDS:-86400}
      PLUITS_BACKUP_RETENTION_DAYS: ${PLUITS_BACKUP_RETENTION_DAYS:-14}
    volumes:
      - pluits-encrypted-backups:/backups
    depends_on:
      database:
        condition: service_healthy
    networks: [data]

  edge:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      PLUITS_API_DOMAIN: ${PLUITS_API_DOMAIN:?Set PLUITS_API_DOMAIN in backend/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - pluits-caddy-data:/data
      - pluits-caddy-config:/config
    depends_on:
      api:
        condition: service_started
    networks: [data, edge]

networks:
  data:
    internal: true
  outbound: {}
  edge: {}

volumes:
  pluits-postgres-data:
  pluits-encrypted-backups:
  pluits-caddy-data:
  pluits-caddy-config:
