name: Social Media browser audit

on:
  pull_request:
    paths:
      - 'src/features/social/**'
      - 'src/features/home/**'
      - 'src/app/**'
      - 'src/config/paths.js'
      - 'src/design-system/**'
      - 'tests/browser/**'
      - '.github/workflows/social-media-browser-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Build production site
        run: npm run build
      - name: Install temporary browser runner
        run: npm install --no-save --package-lock=false playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start Vite preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/pluits-preview.log 2>&1 &
          echo $! > /tmp/pluits-preview.pid
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/pluits/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pluits-preview.log
          exit 1
      - name: Verify Social Media and sibling routes in browser
        run: node tests/browser/social-media-visual-regression.mjs
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-media-browser-audit
          path: artifacts/social-media-browser-audit/
          if-no-files-found: warn
          retention-days: 14
