name: Validate PLUITS development preview

on:
  push:
    branches:
      - development/preview
  pull_request:
    branches:
      - development/preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pluits-development-preview-validation
  cancel-in-progress: true

jobs:
  validate:
    if: github.ref == 'refs/heads/development/preview' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development preview
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
      - name: Build isolated development preview
        env:
          VITE_PLUITS_DEMO_MODE: 'true'
        run: npm run build -- --base=/pluits/
      - name: Verify build output
        run: test -f dist/index.html
