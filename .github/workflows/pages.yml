name: Deploy PLUITS development preview to GitHub Pages

on:
  workflow_run:
    workflows:
      - Validate PLUITS
    types:
      - completed
    branches:
      - development/preview

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pluits-development-preview
  cancel-in-progress: true

jobs:
  build:
    if: github.event.workflow_run.head_branch == 'development/preview' && github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated development commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build isolated development preview
        env:
          VITE_PLUITS_DEMO_MODE: 'true'
        run: npm run build -- --base=/pluits/
      - name: Verify build output
        run: test -f dist/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy development preview
        id: deployment
        uses: actions/deploy-pages@v4
