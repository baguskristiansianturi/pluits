name: Validate PLUITS

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pluits-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify architecture and production contracts
        run: npm test

      - name: Build Vite production
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/assets/brand/pluits-icon-192.png
          test -f dist/assets/brand/pluits-icon-512.png
          test -f dist/assets/brand/apple-touch-icon.png
