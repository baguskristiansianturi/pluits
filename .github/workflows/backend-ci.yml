name: PLUITS Backend CI

on:
  push:
    branches:
      - main
      - backend/independent-foundation
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pluits_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pluits_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_TEST_URL: postgres://postgres:postgres@localhost:5432/pluits_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
          cache-dependency-path: backend/go.mod
      - name: Resolve dependencies
        run: go mod tidy
      - name: Run unit and PostgreSQL integration tests
        run: go test -race ./...
      - name: Build API
        run: go build ./cmd/api
      - name: Build migration command
        run: go build ./cmd/migrate
      - name: Build hardened container targets
        run: |
          docker build --target api -t pluits-api:ci .
          docker build --target migrate -t pluits-migrate:ci .
          docker build --target email-worker -t pluits-email-worker:ci .
