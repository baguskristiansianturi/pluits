name: PLUITS Backend CI

on:
  push:
    branches:
      - backend/independent-foundation
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: backend/go.mod
      - name: Resolve dependencies
        run: go mod tidy
      - name: Run tests
        run: go test ./...
      - name: Build API
        run: go build ./cmd/api
